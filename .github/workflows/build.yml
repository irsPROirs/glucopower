              private fun stepCrankRevolutions(targetRpm: Int) {
                  val rpm = targetRpm.coerceIn(10, 250)
                  val deltaRevs = 1
                  val deltaTime1024 = (deltaRevs * 61440) / rpm
                  cumulativeCrankRevs = (cumulativeCrankRevs + deltaRevs) and 0xFFFF
                  lastCrankEventTime1024 = (lastCrankEventTime1024 + deltaTime1024) and 0xFFFF
              }
          
              private fun broadcastPowerMeasurement() {
                  if (gattServer == null || subscribedDevices.isEmpty() || (!heartTest && lastReadingTime == 0L)) return
                  val value = getWattsValue()
                  val targetChar = activeMeasurement
          
                  val payload = when {
                      heartTest -> BridgeProtocol.heartTestMeasurement()
                      sensorMode == BleSensorMode.HEART_RATE || targetChar == CHAR_HEART_MEASUREMENT ->
                          BridgeProtocol.heartMeasurement(if (value > 0) value else 93)
                      targetChar == CHAR_CSC_MEASUREMENT -> {
                          stepCrankRevolutions(if (value > 0) value else 85)
                          BridgeProtocol.cadenceMeasurement(cumulativeCrankRevs, lastCrankEventTime1024)
                      }
                      includeCrankInPower -> {
                          stepCrankRevolutions(85)
                          BridgeProtocol.powerMeasurementWithCrank(value, cumulativeCrankRevs, lastCrankEventTime1024)
                      }
                      else -> BridgeProtocol.measurement(value)
                  }
                  subscribedDevices.forEach { notificationQueue.offer(it, payload) }
                  sendNextNotification()
              }
          
              private fun resolveCharacteristic(charUuid: UUID): BluetoothGattCharacteristic? {
                  val server = gattServer ?: return null
                  val serviceUuid = when (charUuid) {
                      CHAR_HEART_MEASUREMENT -> SERVICE_HEART_RATE
                      CHAR_CSC_MEASUREMENT -> SERVICE_CSC
                      else -> SERVICE_CYCLING_POWER
                  }
                  return server.getService(serviceUuid)?.getCharacteristic(charUuid)
              }
          
              private fun sendNextNotification() {
                  val server = gattServer ?: return
                  val characteristic = resolveCharacteristic(activeMeasurement)
                  if (characteristic == null) {
                      lastTransfer = "Характеристика измерения отсутствует в GATT"
                      recordBle(lastTransfer)
                      return
                  }
                  while (true) {
                      val (device, payload) = notificationQueue.next() ?: return
                      if (!subscribedDevices.contains(device)) {
                          notificationQueue.complete(device)
                          continue
                      }
                      pendingSince = SystemClock.elapsedRealtime()
                      pendingWarningShown = false
                      val status = try {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                              server.notifyCharacteristicChanged(device, characteristic, false, payload)
                          } else {
                              @Suppress("DEPRECATION")
                              characteristic.value = payload
                              @Suppress("DEPRECATION")
                              if (server.notifyCharacteristicChanged(device, characteristic, false)) 0 else -1
                          }
                      } catch (e: RuntimeException) {
                          recordBle("NOTIFY exception ${e.javaClass.simpleName}: ${e.message}")
                          -1
                      }
                      if (status == 0) {
                          submitted++
                          lastTransfer = "ожидание завершения Android"
                          if (submitted == 1 || submitted % 30 == 0) {
                              recordBle("NOTIFY ${peer(device)}: принято Android (#$submitted), ${payload.size} байт")
                          }
                          return
                      }
                      sendErrors++
                      lastTransfer = "Android отклонил отправку: $status"
                      recordBle("NOTIFY ${peer(device)}: код ошибки $status")
                      notificationQueue.complete(device)
                  }
              }
          
              private fun createAdvertiseCallback(
                  session: Int,
                  hadPrimaryName: Boolean = false,
                  hadScanName: Boolean = false
              ) = object : AdvertiseCallback() {
                  override fun onStartSuccess(settingsInEffect: AdvertiseSettings?) {
                      mainHandler.post {
                          if (session != bleGeneration || !isBleStarting) return@post
                          mainHandler.removeCallbacks(startupTimeout)
                          isBleRunning = true
                          isBleStarting = false
                          recordBle("ADV: Android подтвердил запуск ($sensorMode)")
                          bleStatus = when {
                              heartTest -> "реклама 0x180D (ТЕСТ 93) запущена"
                              sensorMode == BleSensorMode.CADENCE_ONLY -> "реклама 0x1816 (Каденс) запущена; ищите датчик каденса на CC600"
                              sensorMode == BleSensorMode.COMBO_POWER_CADENCE -> "реклама 0x1818 (Мощность) + 0x1816 (Каденс) запущена"
                              sensorMode == BleSensorMode.HEART_RATE -> "реклама 0x180D (Пульс) запущена"
                              else -> "реклама 0x1818 (Мощность) запущена"
                          }
                          refreshStatus()
                      }
                  }
          
                  override fun onStartFailure(errorCode: Int) {
                      mainHandler.post {
                          if (session != bleGeneration || !isBleStarting) return@post
                          if (errorCode == ADVERTISE_FAILED_DATA_TOO_LARGE) {
                              if (hadPrimaryName) {
                                  recordBle("ADV: пакет с именем велик, перенос имени в Scan Response")
                                  advertisePowerService(includeNameInPrimary = false, includeNameInScan = true)
                                  return@post
                              } else if (hadScanName) {
                                  recordBle("ADV: Scan Response тоже велик, запуск только с UUID")
                                  advertisePowerService(includeNameInPrimary = false, includeNameInScan = false)
                                  return@post
                              }
                          }
                          stopBlePeripheral()
                          bleStatus = when (errorCode) {
                              ADVERTISE_FAILED_DATA_TOO_LARGE -> "BLE: рекламный пакет слишком большой"
                              ADVERTISE_FAILED_TOO_MANY_ADVERTISERS -> "BLE: слишком много рекламодателей; закройте другие BLE-приложения"
                              ADVERTISE_FAILED_FEATURE_UNSUPPORTED -> "BLE Advertising не поддерживается телефоном"
                              else -> "Ошибка BLE Advertising: $errorCode; повторите запуск"
                          }
                          recordBle(bleStatus)
                          Log.e(TAG, bleStatus)
                          refreshStatus()
                      }
                  }
              }
          
              private fun createGattCallback(session: Int) = object : BluetoothGattServerCallback() {
                  override fun onServiceAdded(status: Int, service: BluetoothGattService) {
                      mainHandler.post {
                          if (session != bleGeneration || !isBleStarting || gattServer == null) return@post
                          recordBle(
                              "GATT: зарегистрирован ${service.uuid}, status=$status, характеристики=" +
                                  service.characteristics.joinToString { "${it.uuid}/${it.instanceId}" }
                          )
                          if (status == BluetoothGatt.GATT_SUCCESS) {
                              if (pendingServicesQueue.isNotEmpty()) {
                                  addNextQueuedService()
                              } else {
                                  advertisePowerService(includeNameInPrimary = true, includeNameInScan = true)
                              }
                          } else {
                              stopBlePeripheral()
                              bleStatus = "Ошибка регистрации GATT: $status"
                              refreshStatus()
                          }
                      }
                  }
          
                  override fun onConnectionStateChange(device: BluetoothDevice, status: Int, newState: Int) {
                      mainHandler.post {
                          if (session != bleGeneration) return@post
                          recordBle("LINK ${peer(device)}: state=$newState, status=$status")
                          if (newState == BluetoothProfile.STATE_CONNECTED && status == BluetoothGatt.GATT_SUCCESS) {
                              connectedDevices.add(device)
                          } else if (newState == BluetoothProfile.STATE_DISCONNECTED) {
                              connectedDevices.remove(device)
                              subscribedDevices.remove(device)
                              notificationQueue.remove(device, disconnected = true)
                              sendNextNotification()
                          }
                          notifyUi()
                      }
                  }
          
                  override fun onCharacteristicReadRequest(
                      device: BluetoothDevice,
                      requestId: Int,
                      offset: Int,
                      characteristic: BluetoothGattCharacteristic
                  ) {
                      mainHandler.post {
                          if (session != bleGeneration) return@post
                          recordBle("READ ${peer(device)}: ${characteristic.uuid}/${characteristic.instanceId}, offset=$offset")
                          val bytes = when (characteristic.uuid) {
                              CHAR_POWER_FEATURE -> byteArrayOf(0x08, 0x00, 0x00, 0x00) // Crank Revolution Data Supported
                              CHAR_CSC_FEATURE -> byteArrayOf(0x02, 0x00)               // Crank Revolution Data Supported
                              CHAR_SENSOR_LOCATION -> byteArrayOf(5)                    // Left Crank
                              CHAR_MANUFACTURER_NAME -> "Magene".toByteArray(Charsets.UTF_8)
                              CHAR_MODEL_NUMBER -> "P505".toByteArray(Charsets.UTF_8)
                              CHAR_FIRMWARE_REV -> "1.4".toByteArray(Charsets.UTF_8)
                              CHAR_BATTERY_LEVEL -> byteArrayOf(85)
                              else -> null
                          }
                          val status = when {
                              bytes == null -> BluetoothGatt.GATT_REQUEST_NOT_SUPPORTED
                              offset < 0 || offset > bytes.size -> BluetoothGatt.GATT_INVALID_OFFSET
                              else -> BluetoothGatt.GATT_SUCCESS
                          }
                          gattServer?.sendResponse(
                              device,
                              requestId,
                              status,
                              offset,
                              if (status == BluetoothGatt.GATT_SUCCESS) bytes!!.copyOfRange(offset, bytes.size) else null
                          )
                      }
                  }
          
                  override fun onCharacteristicWriteRequest(
                      device: BluetoothDevice,
                      requestId: Int,
                      characteristic: BluetoothGattCharacteristic,
                      preparedWrite: Boolean,
                      responseNeeded: Boolean,
                      offset: Int,
                      value: ByteArray
                  ) {
                      mainHandler.post {
                          if (session != bleGeneration) return@post
                          recordBle("WRITE CHAR ${peer(device)}: ${characteristic.uuid}")
                          if (responseNeeded) {
                              gattServer?.sendResponse(device, requestId, BluetoothGatt.GATT_SUCCESS, 0, null)
                          }
                      }
                  }
          
                  override fun onDescriptorReadRequest(
                      device: BluetoothDevice,
                      requestId: Int,
                      offset: Int,
                      descriptor: BluetoothGattDescriptor
                  ) {
                      mainHandler.post {
                          if (session != bleGeneration) return@post
                          recordBle("READ CCCD ${peer(device)}: ${descriptor.characteristic.uuid}, offset=$offset")
                          val charUuid = descriptor.characteristic.uuid
                          val known = descriptor.uuid == CCCD_UUID && (
                              charUuid == CHAR_POWER_MEASUREMENT ||
                                  charUuid == CHAR_CSC_MEASUREMENT ||
                                  charUuid == CHAR_HEART_MEASUREMENT ||
                                  charUuid == CHAR_POWER_CONTROL_POINT ||
                                  charUuid == CHAR_SC_CONTROL_POINT ||
                                  charUuid == CHAR_BATTERY_LEVEL
                              )
                          val value = if (subscribedDevices.contains(device)) BluetoothGattDescriptor.ENABLE_NOTIFICATION_VALUE
                          else BluetoothGattDescriptor.DISABLE_NOTIFICATION_VALUE
                          val status = when {
                              !known -> BluetoothGatt.GATT_REQUEST_NOT_SUPPORTED
                              offset < 0 || offset > value.size -> BluetoothGatt.GATT_INVALID_OFFSET
                              else -> BluetoothGatt.GATT_SUCCESS
                          }
                          gattServer?.sendResponse(
                              device,
                              requestId,
                              status,
                              offset,
                              if (status == BluetoothGatt.GATT_SUCCESS) value.copyOfRange(offset, value.size) else null
                          )
                      }
                  }
          
                  override fun onDescriptorWriteRequest(
                      device: BluetoothDevice,
                      requestId: Int,
                      descriptor: BluetoothGattDescriptor,
                      preparedWrite: Boolean,
                      responseNeeded: Boolean,
                      offset: Int,
                      value: ByteArray
                  ) {
                      val bytes = value.copyOf()
                      mainHandler.post {
                          if (session != bleGeneration) return@post
                          val charUuid = descriptor.characteristic.uuid
                          recordBle(
                              "WRITE CCCD ${peer(device)}: $charUuid, value=" +
                                  bytes.joinToString("") { "%02x".format(it.toInt() and 255) } +
                                  ", offset=$offset, prepared=$preparedWrite, response=$responseNeeded"
                          )
                          val isMeasurementChar = charUuid == CHAR_POWER_MEASUREMENT ||
                              charUuid == CHAR_CSC_MEASUREMENT ||
                              charUuid == CHAR_HEART_MEASUREMENT
                          val isControlPointChar = charUuid == CHAR_POWER_CONTROL_POINT ||
                              charUuid == CHAR_SC_CONTROL_POINT ||
                              charUuid == CHAR_BATTERY_LEVEL
          
                          val enabledNotify = bytes.contentEquals(BluetoothGattDescriptor.ENABLE_NOTIFICATION_VALUE)
                          val enabledIndicate = bytes.contentEquals(BluetoothGattDescriptor.ENABLE_INDICATION_VALUE)
                          val disabled = bytes.contentEquals(BluetoothGattDescriptor.DISABLE_NOTIFICATION_VALUE)
          
                          val validTarget = descriptor.uuid == CCCD_UUID && (
                              (isMeasurementChar && (enabledNotify || disabled)) ||
                                  (isControlPointChar && (enabledIndicate || enabledNotify || disabled))
                              )
          
                          val status = when {
                              preparedWrite || !validTarget -> BluetoothGatt.GATT_REQUEST_NOT_SUPPORTED
                              offset != 0 -> BluetoothGatt.GATT_INVALID_OFFSET
                              else -> BluetoothGatt.GATT_SUCCESS
                          }
                          if (responseNeeded && gattServer?.sendResponse(device, requestId, status, 0, null) != true) {
                              recordBle("CCCD: Android не принял ответ на запись")
                              return@post
                          }
                          if (status != BluetoothGatt.GATT_SUCCESS) {
                              recordBle("CCCD: запись отклонена, status=$status")
                              return@post
                          }
                          if (isMeasurementChar) {
                              if (enabledNotify) {
                                  activeSubscribedCharUuid = charUuid
                                  subscribedDevices.add(device)
                                  recordBle("SUBSCRIBE ${peer(device)}: уведомления включены ($charUuid)")
                                  lastTransfer = "подписка получена ($charUuid)"
                                  broadcastPowerMeasurement()
                              } else if (disabled) {
                                  subscribedDevices.remove(device)
                                  notificationQueue.remove(device)
                                  recordBle("UNSUBSCRIBE ${peer(device)}")
                              }
                          }
                          notifyUi()
                      }
                  }
          
                  override fun onNotificationSent(device: BluetoothDevice, status: Int) {
                      mainHandler.post {
                          if (session != bleGeneration || !notificationQueue.complete(device)) return@post
                          if (status == BluetoothGatt.GATT_SUCCESS) {
                              completed++
                              lastTransfer = "Android завершил отправку"
                              if (completed == 1 || completed % 30 == 0) recordBle("SENT ${peer(device)}: status=0 (#$completed)")
                          } else {
                              sendErrors++
                              lastTransfer = "ошибка завершения отправки: $status"
                              recordBle("SENT ${peer(device)}: status=$status")
                          }
                          sendNextNotification()
                          notifyUi()
                      }
                  }
              }
          
              private fun createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          CHANNEL_ID,
                          "GlucoBLE Датчик",
                          NotificationManager.IMPORTANCE_LOW
                      )
                      val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      nm.createNotificationChannel(channel)
                  }
              }
          
              private fun buildNotification(): Notification {
                  val text = String.format(
                      "Сахар: %.1f ммоль/л → на Geoid CC600: %d (%s)",
                      currentMmol,
                      getWattsValue(),
                      lastSource
                  )
                  val builder = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      Notification.Builder(this, CHANNEL_ID)
                  } else {
                      @Suppress("DEPRECATION")
                      Notification.Builder(this)
                  }
                  val stale = lastReadingTime > 0 && System.currentTimeMillis() - lastReadingTime > 15 * 60000L
                  val updateText = "Измерение: ${readingTime()}" + if (stale) " — нет свежих данных" else ""
                  val details = "$text\n$updateText\nBLE: $bleStatus\nПодписки: ${subscribedDevices.size}; $lastTransfer"
                  val openApp = PendingIntent.getActivity(
                      this,
                      0,
                      Intent(this, MainActivity::class.java),
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  return builder
                      .setContentTitle(
                          if (heartTest) "GlucoPower: ТЕСТ пульсометра 93"
                          else if (lastReadingTime == 0L) "GlucoPower: ожидание xDrip+"
                          else String.format("%.1f ммоль/л → %d (%s)", currentMmol, getWattsValue(), sensorMode.name)
                      )
                      .setContentText(if (heartTest) "ТЕСТ BLE, не реальные данные" else updateText)
                      .setStyle(Notification.BigTextStyle().bigText(details))
                      .setWhen(lastReadingTime)
                      .setShowWhen(lastReadingTime > 0)
                      .setOnlyAlertOnce(true)
                      .setContentIntent(openApp)
                      .setSmallIcon(com.example.glucoble.R.drawable.ic_notification)
                      .setOngoing(true)
                      .build()
              }
          }
