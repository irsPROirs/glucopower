              /**
               * Сервис Cycling Power (0x1818):
               * - При withControlPoint = false (Режим 1 по умолчанию) содержит ровно 3 обязательные характеристики (как в v1.0 на Redmi 8).
               * - При withControlPoint = true (Режим 2) включает также Control Point (0x2A66) с автоответом калибровки.
               */
              private fun createCyclingPowerService(withControlPoint: Boolean): BluetoothGattService {
                  val service = BluetoothGattService(SERVICE_CYCLING_POWER, BluetoothGattService.SERVICE_TYPE_PRIMARY)
          
                  val measurement = BluetoothGattCharacteristic(
                      CHAR_POWER_MEASUREMENT,
