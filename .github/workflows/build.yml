name: Build GlucoPower APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Android project & Compile APK
        run: |
          mkdir -p app/src/main/java/com/example/glucoble

          cat << 'EOF_SETTINGS' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "GlucoPower"
          include(":app")
          EOF_SETTINGS

          cat << 'EOF_ROOT_GRADLE' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF_ROOT_GRADLE

          cat << 'EOF_PROPS' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF_PROPS

          cat << 'EOF_APP_GRADLE' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          
          android {
              namespace = "com.example.glucoble"
              compileSdk = 34
          
              defaultConfig {
                  applicationId = "com.example.glucoble"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 5
                  versionName = "1.4"
              }
          
              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
          
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          
          dependencies {
              testImplementation("junit:junit:4.13.2")
              testImplementation("org.robolectric:robolectric:4.14.1")
              testImplementation("org.mockito:mockito-core:5.14.2")
          }
          EOF_APP_GRADLE

          cat << 'EOF_MANIFEST' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.example.glucoble">
          
              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADVERTISE" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
          
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_CONNECTED_DEVICE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
          
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="com.eveningoutpost.dexdrip.permissions.RECEIVE_BG_ESTIMATE" />
          
              <uses-feature
                  android:name="android.hardware.bluetooth_le"
                  android:required="true" />
          
              <queries>
                  <package android:name="de.michelinside.glucodatahandler" />
                  <package android:name="com.eveningoutpost.dexdrip" />
                  <package android:name="tk.glucodata" />
              </queries>
          
              <application
                  android:label="GlucoPower"
                  android:icon="@drawable/ic_launcher"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Material.Light.DarkActionBar">
          
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
          
                  <service
                      android:name=".GlucoBleBridgeService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="connectedDevice" />
          
              </application>
          </manifest>
          EOF_MANIFEST

