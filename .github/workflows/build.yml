                          Toast.makeText(
                              this@MainActivity,
                              "Журнал скопирован — его можно вставить в сообщение",
                              Toast.LENGTH_LONG
                          ).show()
                      }
                  })
          
                  val btnBattery = Button(this).apply {
                      text = "3. Разрешить работу в фоне (батарея)"
                      setOnClickListener {
                          val power = getSystemService(Context.POWER_SERVICE) as PowerManager
                          if (power.isIgnoringBatteryOptimizations(packageName)) {
                              Toast.makeText(
                                  this@MainActivity,
                                  "Оптимизация уже отключена. Проверьте также автозапуск в настройках телефона.",
                                  Toast.LENGTH_LONG
                              ).show()
                          } else {
                              val request = Intent(
                                  Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS,
                                  Uri.parse("package:$packageName")
                              )
                              if (request.resolveActivity(packageManager) != null) startActivity(request)
                              else startActivity(
                                  Intent(
                                      Settings.ACTION_APPLICATION_DETAILS_SETTINGS,
                                      Uri.parse("package:$packageName")
