                      text = "GlucoPower 1.5 → Geoid CC600 (vivo / Android 16 fix)"
                      textSize = 19f
                      setPadding(0, 0, 0, 12)
                  }
                  root.addView(titleView)
          
                  val hintView = TextView(this).apply {
