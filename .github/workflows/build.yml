name: Build GlucoBLE Power APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Project Structure & Source Files
        run: |
          rm -rf app settings.gradle.kts build.gradle.kts gradle.properties
          mkdir -p app/src/main/java/com/example/glucoble

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "GlucoBLE"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.glucoble"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.glucoble"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 2
                  versionName = "1.1"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADVERTISE" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_CONNECTED_DEVICE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="true"
                  android:label="GlucoBLE Power"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.DarkActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".GlucoBleBridgeService"
                      android:enabled="true"
                      android:exported="true"
                      android:foregroundServiceType="connectedDevice" />
              </application>
          </manifest>
          EOF
          # Удаляем ведущие пробелы в AndroidManifest.xml, чтобы избежать ошибки XML-пролога
          sed -i 's/^[[:space:]]*//' app/src/main/AndroidManifest.xml

          cat << 'EOF' > app/src/main/java/com/example/glucoble/MainActivity.kt
          package com.example.glucoble

          import android.Manifest
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.pm.PackageManager
          import android.os.Build
          import android.os.Bundle
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat

          class MainActivity : AppCompatActivity() {

              private lateinit var tvStatus: TextView
              private lateinit var tvLogs: TextView
              private lateinit var spUnit: Spinner

              private val uiReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) {
                      when (intent?.action) {
                          GlucoBleBridgeService.ACTION_UI_LOG -> {
                              val msg = intent.getStringExtra("msg") ?: return
                              tvLogs.append("$msg\n")
                          }
                          GlucoBleBridgeService.ACTION_UI_STATUS -> {
                              val status = intent.getStringExtra("status") ?: return
                              tvStatus.text = status
                          }
                      }
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(32, 32, 32, 32)
                  }

                  tvStatus = TextView(this).apply {
                      text = "Статус: Остановлен"
                      textSize = 18f
                  }
                  layout.addView(tvStatus)

                  spUnit = Spinner(this).apply {
                      adapter = ArrayAdapter(
                          this@MainActivity,
                          android.R.layout.simple_spinner_dropdown_item,
                          listOf("mg/dL (например 120 -> 120W)", "mmol/L * 10 (например 5.6 -> 56W)")
                      )
                  }
                  layout.addView(spUnit)

                  val btnStart = Button(this).apply {
                      text = "Запустить датчик мощности (0x1818)"
                      setOnClickListener {
                          checkPermissionsAndStart()
                      }
                  }
                  layout.addView(btnStart)

                  val btnTest = Button(this).apply {
                      text = "Отправить тест (случайные 110..160W)"
                      setOnClickListener {
                          val i = Intent(this@MainActivity, GlucoBleBridgeService::class.java).apply {
                              action = GlucoBleBridgeService.ACTION_TEST_DATA
                              putExtra("value", (110..160).random())
                          }
                          ContextCompat.startForegroundService(this@MainActivity, i)
                      }
                  }
                  layout.addView(btnTest)

                  val btnStop = Button(this).apply {
                      text = "Остановить сервис"
                      setOnClickListener {
                          stopService(Intent(this@MainActivity, GlucoBleBridgeService::class.java))
                          tvStatus.text = "Статус: Остановлен"
                      }
                  }
                  layout.addView(btnStop)

                  val scroll = ScrollView(this)
                  tvLogs = TextView(this).apply {
                      textSize = 12f
                      text = "Логи работы:\n"
                  }
                  scroll.addView(tvLogs)
                  layout.addView(scroll)

                  setContentView(layout)
              }

              override fun onResume() {
                  super.onResume()
                  val filter = IntentFilter().apply {
                      addAction(GlucoBleBridgeService.ACTION_UI_LOG)
                      addAction(GlucoBleBridgeService.ACTION_UI_STATUS)
                  }
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      registerReceiver(uiReceiver, filter, Context.RECEIVER_EXPORTED)
                  } else {
                      registerReceiver(uiReceiver, filter)
                  }
              }

              override fun onPause() {
                  super.onPause()
                  unregisterReceiver(uiReceiver)
              }

              private fun checkPermissionsAndStart() {
                  val perms = mutableListOf(
                      Manifest.permission.ACCESS_FINE_LOCATION,
                      Manifest.permission.ACCESS_COARSE_LOCATION
                  )
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                      perms.add(Manifest.permission.BLUETOOTH_ADVERTISE)
                      perms.add(Manifest.permission.BLUETOOTH_CONNECT)
                  }
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      perms.add(Manifest.permission.POST_NOTIFICATIONS)
                  }

                  val missing = perms.filter {
                      ContextCompat.checkSelfPermission(this, it) != PackageManager.PERMISSION_GRANTED
                  }

                  if (missing.isNotEmpty()) {
                      ActivityCompat.requestPermissions(this, missing.toTypedArray(), 100)
                  } else {
                      startBleService()
                  }
              }

              private fun startBleService() {
                  val intent = Intent(this, GlucoBleBridgeService::class.java).apply {
                      putExtra("use_mmol", spUnit.selectedItemPosition == 1)
                  }
                  ContextCompat.startForegroundService(this, intent)
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/glucoble/GlucoBleBridgeService.kt
          package com.example.glucoble

          import android.annotation.SuppressLint
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.bluetooth.*
          import android.bluetooth.le.AdvertiseCallback
          import android.bluetooth.le.AdvertiseData
          import android.bluetooth.le.AdvertiseSettings
          import android.bluetooth.le.BluetoothLeAdvertiser
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.os.*
          import android.util.Log
          import androidx.core.app.NotificationCompat
          import java.nio.ByteBuffer
          import java.nio.ByteOrder
          import java.text.SimpleDateFormat
          import java.util.*
          import java.util.concurrent.CopyOnWriteArraySet
          import kotlin.math.roundToInt

          @SuppressLint("MissingPermission")
          class GlucoBleBridgeService : Service() {

              companion object {
                  private const val TAG = "GlucoBlePower"
                  private const val CHANNEL_ID = "gluco_ble_channel"
                  private const val NOTIFICATION_ID = 101

                  const val ACTION_UI_LOG = "com.example.glucoble.UI_LOG"
                  const val ACTION_UI_STATUS = "com.example.glucoble.UI_STATUS"
                  const val ACTION_TEST_DATA = "com.example.glucoble.TEST_DATA"

                  private const val ACTION_XDRIP_BG = "com.eveningoutpost.dexdrip.BgEstimate"
                  private const val EXTRA_BG_ESTIMATE = "com.eveningoutpost.dexdrip.Extras.BgEstimate"

                  val CPS_SERVICE_UUID: UUID = UUID.fromString("00001818-0000-1000-8000-00805f9b34fb")
                  val CPS_MEASUREMENT_UUID: UUID = UUID.fromString("00002a63-0000-1000-8000-00805f9b34fb")
                  val CPS_FEATURE_UUID: UUID = UUID.fromString("00002a65-0000-1000-8000-00805f9b34fb")
                  val SENSOR_LOCATION_UUID: UUID = UUID.fromString("00002a5d-0000-1000-8000-00805f9b34fb")
                  val CCCD_UUID: UUID = UUID.fromString("00002902-0000-1000-8000-00805f9b34fb")
              }

              private var bluetoothManager: BluetoothManager? = null
              private var bluetoothAdapter: BluetoothAdapter? = null
              private var advertiser: BluetoothLeAdvertiser? = null
              private var gattServer: BluetoothGattServer? = null
              private var powerMeasurementChar: BluetoothGattCharacteristic? = null

              private val connectedDevices = CopyOnWriteArraySet<BluetoothDevice>()
              private val handler = Handler(Looper.getMainLooper())

              @Volatile
              private var currentGlucoseWatts: Int = 120
              private var useMmol: Boolean = false

              private var cumulativeCrankRevs: Int = 0
              private var lastCrankEventTime: Int = 0

              private val xdripReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) {
                      if (intent?.action == ACTION_XDRIP_BG) {
                          val extras = intent.extras ?: return
                          val bgMgDl = when (val raw = extras.get(EXTRA_BG_ESTIMATE)) {
                              is Double -> raw
                              is Float -> raw.toDouble()
                              is Int -> raw.toDouble()
                              is Long -> raw.toDouble()
                              else -> intent.getDoubleExtra(EXTRA_BG_ESTIMATE, -1.0)
                          }
                          if (bgMgDl > 0) {
                              currentGlucoseWatts = if (useMmol) {
                                  ((bgMgDl / 18.0182) * 10.0).roundToInt()
                              } else {
                                  bgMgDl.roundToInt()
                              }
                              logToUi("xDrip получен: $bgMgDl mg/dL -> Передаем ${currentGlucoseWatts}W")
                              updateStatus("Активен: ${currentGlucoseWatts}W (Подключено: ${connectedDevices.size})")
                          }
                      }
                  }
              }

              private val broadcastRunnable = object : Runnable {
                  override fun run() {
                      sendPowerNotification()
                      handler.postDelayed(this, 1000L)
                  }
              }

              override fun onCreate() {
                  super.onCreate()
                  createNotificationChannel()
                  startForeground(NOTIFICATION_ID, buildNotification("Запуск датчика мощности..."))
                  registerXdripReceiver()
                  initBluetooth()
                  handler.postDelayed(broadcastRunnable, 1000L)
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == ACTION_TEST_DATA) {
                      currentGlucoseWatts = intent.getIntExtra("value", 145)
                      logToUi("Установлено тестовое значение: ${currentGlucoseWatts}W")
                      sendPowerNotification()
                  } else if (intent != null && intent.hasExtra("use_mmol")) {
                      useMmol = intent.getBooleanExtra("use_mmol", false)
                      logToUi("Режим единиц: ${if (useMmol) "mmol/L * 10" else "mg/dL"}")
                  }
                  return START_STICKY
              }

              override fun onDestroy() {
                  handler.removeCallbacksAndMessages(null)
                  try { unregisterReceiver(xdripReceiver) } catch (_: Exception) {}
                  stopBle()
                  super.onDestroy()
              }

              override fun onBind(intent: Intent?): IBinder? = null

              private fun registerXdripReceiver() {
                  val filter = IntentFilter(ACTION_XDRIP_BG)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      registerReceiver(xdripReceiver, filter, Context.RECEIVER_EXPORTED)
                  } else {
                      registerReceiver(xdripReceiver, filter)
                  }
                  logToUi("Слушаем xDrip Broadcast ($ACTION_XDRIP_BG)")
              }

              private fun initBluetooth() {
                  bluetoothManager = getSystemService(Context.BLUETOOTH_SERVICE) as BluetoothManager
                  bluetoothAdapter = bluetoothManager?.adapter

                  if (bluetoothAdapter == null || bluetoothAdapter?.isEnabled != true) {
                      logToUi("ОШИБКА: Bluetooth выключен")
                      return
                  }

                  try { bluetoothAdapter?.name = "GlucoPower" } catch (_: Exception) {}

                  setupGattServer()
                  startAdvertising()
              }

              private fun setupGattServer() {
                  gattServer = bluetoothManager?.openGattServer(this, gattServerCallback)
                  val service = BluetoothGattService(CPS_SERVICE_UUID, BluetoothGattService.SERVICE_TYPE_PRIMARY)

                  powerMeasurementChar = BluetoothGattCharacteristic(
                      CPS_MEASUREMENT_UUID,
                      BluetoothGattCharacteristic.PROPERTY_NOTIFY,
                      BluetoothGattCharacteristic.PERMISSION_READ
                  ).apply {
                      val cccd = BluetoothGattDescriptor(
                          CCCD_UUID,
                          BluetoothGattDescriptor.PERMISSION_READ or BluetoothGattDescriptor.PERMISSION_WRITE
                      )
                      cccd.value = BluetoothGattDescriptor.DISABLE_NOTIFICATION_VALUE
                      addDescriptor(cccd)
                  }

                  val powerFeatureChar = BluetoothGattCharacteristic(
                      CPS_FEATURE_UUID,
                      BluetoothGattCharacteristic.PROPERTY_READ,
                      BluetoothGattCharacteristic.PERMISSION_READ
                  )

                  val sensorLocationChar = BluetoothGattCharacteristic(
                      SENSOR_LOCATION_UUID,
                      BluetoothGattCharacteristic.PROPERTY_READ,
                      BluetoothGattCharacteristic.PERMISSION_READ
                  )

                  service.addCharacteristic(powerMeasurementChar)
                  service.addCharacteristic(powerFeatureChar)
                  service.addCharacteristic(sensorLocationChar)

                  gattServer?.addService(service)
                  logToUi("GATT сервер (0x1818 + 0x2A63 + 0x2A65 + 0x2A5D) создан")
              }

              private fun startAdvertising() {
                  advertiser = bluetoothAdapter?.bluetoothLeAdvertiser
                  if (advertiser == null) {
                      logToUi("ОШИБКА: BLE Advertising не поддерживается")
                      return
                  }

                  val settings = AdvertiseSettings.Builder()
                      .setAdvertiseMode(AdvertiseSettings.ADVERTISE_MODE_LOW_LATENCY)
                      .setConnectable(true)
                      .setTimeout(0)
                      .setTxPowerLevel(AdvertiseSettings.ADVERTISE_TX_POWER_HIGH)
                      .build()

                  val advertiseData = AdvertiseData.Builder()
                      .setIncludeDeviceName(false)
                      .setIncludeTxPowerLevel(false)
                      .addServiceUuid(ParcelUuid(CPS_SERVICE_UUID))
                      .build()

                  val scanResponse = AdvertiseData.Builder()
                      .setIncludeDeviceName(true)
                      .build()

                  advertiser?.startAdvertising(settings, advertiseData, scanResponse, advertiseCallback)
              }

              private val advertiseCallback = object : AdvertiseCallback() {
                  override fun onStartSuccess(settingsInEffect: AdvertiseSettings?) {
                      logToUi("Реклама датчика мощности 0x1818 запущена!")
                      updateStatus("Реклама активна (${currentGlucoseWatts}W)")
                  }

                  override fun onStartFailure(errorCode: Int) {
                      logToUi("Ошибка запуска BLE рекламы: код $errorCode")
                  }
              }

              private val gattServerCallback = object : BluetoothGattServerCallback() {
                  override fun onConnectionStateChange(device: BluetoothDevice, status: Int, newState: Int) {
                      if (newState == BluetoothProfile.STATE_CONNECTED) {
                          connectedDevices.add(device)
                          logToUi("Велокомпьютер подключился: ${device.address}")
                          updateStatus("Подключено: ${device.address} (${currentGlucoseWatts}W)")
                      } else if (newState == BluetoothProfile.STATE_DISCONNECTED) {
                          connectedDevices.remove(device)
                          logToUi("Велокомпьютер отключился: ${device.address}")
                          updateStatus("Ожидание подключения (${currentGlucoseWatts}W)")
                      }
                  }

                  override fun onCharacteristicReadRequest(
                      device: BluetoothDevice,
                      requestId: Int,
                      offset: Int,
                      characteristic: BluetoothGattCharacteristic
                  ) {
                      when (characteristic.uuid) {
                          CPS_FEATURE_UUID -> {
                              val featureBytes = byteArrayOf(0x08, 0x00, 0x00, 0x00)
                              gattServer?.sendResponse(device, requestId, BluetoothGatt.GATT_SUCCESS, offset, featureBytes)
                              logToUi("Чтение Feature (0x2A65) от ${device.address}")
                          }
                          SENSOR_LOCATION_UUID -> {
                              val locationBytes = byteArrayOf(0x05)
                              gattServer?.sendResponse(device, requestId, BluetoothGatt.GATT_SUCCESS, offset, locationBytes)
                              logToUi("Чтение Sensor Location (0x2A5D) от ${device.address}")
                          }
                          else -> {
                              gattServer?.sendResponse(device, requestId, BluetoothGatt.GATT_FAILURE, offset, null)
                          }
                      }
                  }

                  override fun onDescriptorReadRequest(
                      device: BluetoothDevice,
                      requestId: Int,
                      offset: Int,
                      descriptor: BluetoothGattDescriptor
                  ) {
                      if (descriptor.uuid == CCCD_UUID) {
                          val value = if (connectedDevices.contains(device)) {
                              BluetoothGattDescriptor.ENABLE_NOTIFICATION_VALUE
                          } else {
                              BluetoothGattDescriptor.DISABLE_NOTIFICATION_VALUE
                          }
                          gattServer?.sendResponse(device, requestId, BluetoothGatt.GATT_SUCCESS, offset, value)
                      } else {
                          gattServer?.sendResponse(device, requestId, BluetoothGatt.GATT_FAILURE, offset, null)
                      }
                  }

                  override fun onDescriptorWriteRequest(
                      device: BluetoothDevice,
                      requestId: Int,
                      descriptor: BluetoothGattDescriptor,
                      preparedWrite: Boolean,
                      responseNeeded: Boolean,
                      offset: Int,
                      value: ByteArray?
                  ) {
                      if (descriptor.uuid == CCCD_UUID) {
                          connectedDevices.add(device)
                          logToUi("Подписка CCCD (0x2902) оформлена: ${device.address}")
                          if (responseNeeded) {
                              gattServer?.sendResponse(device, requestId, BluetoothGatt.GATT_SUCCESS, 0, null)
                          }
                          handler.postDelayed({ sendPowerNotification() }, 150L)
                      } else if (responseNeeded) {
                          gattServer?.sendResponse(device, requestId, BluetoothGatt.GATT_FAILURE, offset, null)
                      }
                  }
              }

              private fun sendPowerNotification() {
                  val server = gattServer ?: return
                  val characteristic = powerMeasurementChar ?: return
                  if (connectedDevices.isEmpty()) return

                  cumulativeCrankRevs = (cumulativeCrankRevs + 1) and 0xFFFF
                  lastCrankEventTime = (lastCrankEventTime + 1024) and 0xFFFF

                  val payload = ByteBuffer.allocate(8).order(ByteOrder.LITTLE_ENDIAN).apply {
                      putShort(0x0020.toShort())
                      putShort(currentGlucoseWatts.coerceIn(0, 2000).toShort())
                      putShort(cumulativeCrankRevs.toShort())
                      putShort(lastCrankEventTime.toShort())
                  }.array()

                  for (device in connectedDevices) {
                      try {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                              val status = server.notifyCharacteristicChanged(device, characteristic, false, payload)
                              logToUi("TX -> ${device.address}: ${currentGlucoseWatts}W (код $status)")
                          } else {
                              @Suppress("DEPRECATION")
                              characteristic.value = payload
                              @Suppress("DEPRECATION")
                              server.notifyCharacteristicChanged(device, characteristic, false)
                              logToUi("TX -> ${device.address}: ${currentGlucoseWatts}W")
                          }
                      } catch (e: Exception) {
                          logToUi("Ошибка TX: ${e.message}")
                      }
                  }
              }

              private fun stopBle() {
                  try {
                      advertiser?.stopAdvertising(advertiseCallback)
                      gattServer?.close()
                  } catch (_: Exception) {}
              }

              private fun logToUi(msg: String) {
                  Log.d(TAG, msg)
                  val time = SimpleDateFormat("HH:mm:ss", Locale.getDefault()).format(Date())
                  sendBroadcast(Intent(ACTION_UI_LOG).putExtra("msg", "[$time] $msg"))
              }

              private fun updateStatus(status: String) {
                  val manager = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  manager.notify(NOTIFICATION_ID, buildNotification(status))
                  sendBroadcast(Intent(ACTION_UI_STATUS).putExtra("status", status))
              }

              private fun createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          CHANNEL_ID,
                          "GlucoBLE Power Sensor",
                          NotificationManager.IMPORTANCE_LOW
                      )
                      getSystemService(NotificationManager::class.java).createNotificationChannel(channel)
                  }
              }

              private fun buildNotification(text: String): Notification {
                  return NotificationCompat.Builder(this, CHANNEL_ID)
                      .setContentTitle("GlucoBLE Power")
                      .setContentText(text)
                      .setSmallIcon(android.R.drawable.stat_sys_data_bluetooth)
                      .setOngoing(true)
                      .build()
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK with Gradle
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlucoBLE-Power-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
