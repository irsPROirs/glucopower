              override fun onResume() {
                  super.onResume()
                  val filter = IntentFilter(GlucoBleBridgeService.ACTION_UI_UPDATE)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      registerReceiver(uiReceiver, filter, Context.RECEIVER_NOT_EXPORTED)
                  } else {
                      registerReceiver(uiReceiver, filter)
                  }
              }
          
              override fun onPause() {
                  runCatching { unregisterReceiver(uiReceiver) }
                  super.onPause()
              }
          
              private fun selectedMode(): BleSensorMode = when {
                  radioCadence.isChecked -> BleSensorMode.CADENCE_ONLY
                  radioPower.isChecked -> BleSensorMode.POWER_ONLY
                  radioHeart.isChecked -> BleSensorMode.HEART_RATE
                  else -> BleSensorMode.COMBO_POWER_CADENCE
              }
          
              private fun ensureBlePermissions(): Boolean {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                      val needed = mutableListOf(
                          Manifest.permission.BLUETOOTH_ADVERTISE,
                          Manifest.permission.BLUETOOTH_CONNECT
                      )
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                          needed.add(Manifest.permission.POST_NOTIFICATIONS)
                      }
                      val missing = needed.filter {
                          checkSelfPermission(it) != PackageManager.PERMISSION_GRANTED
                      }
                      if (missing.isNotEmpty()) {
                          requestPermissions(missing.toTypedArray(), 101)
                          return false
                      }
                  }
                  return true
              }
          
              private fun startBridgeService(testMmol: Double?) {
                  val mode = selectedMode()
                  val serviceIntent = Intent(this, GlucoBleBridgeService::class.java).apply {
                      putExtra(GlucoBleBridgeService.EXTRA_SENSOR_MODE, mode.name)
                      putExtra(GlucoBleBridgeService.EXTRA_HEART_TEST, mode == BleSensorMode.HEART_RATE)
                      putExtra(GlucoBleBridgeService.EXTRA_MULTIPLY_BY_10, checkMultiply10.isChecked)
                      if (testMmol != null) {
                          putExtra(GlucoBleBridgeService.EXTRA_TEST_MMOL, testMmol)
                      }
                  }
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      startForegroundService(serviceIntent)
                  } else {
                      startService(serviceIntent)
                  }
                  Toast.makeText(this, "Запуск BLE (${mode.name})", Toast.LENGTH_SHORT).show()
              }
          }
          
          @SuppressLint("MissingPermission", "WakelockTimeout")
          class GlucoBleBridgeService : Service() {
          
              companion object {
                  private const val TAG = "GlucoBleBridge"
                  private const val CHANNEL_ID = "gluco_ble_power_channel"
                  private const val NOTIFICATION_ID = 1001
          
                  const val EXTRA_MULTIPLY_BY_10 = "extra_multiply_by_10"
                  const val EXTRA_HEART_TEST = "extra_heart_test"
                  const val EXTRA_SENSOR_MODE = "extra_sensor_mode"
                  const val EXTRA_TEST_MMOL = "extra_test_mmol"
                  const val ACTION_UI_UPDATE = "com.example.glucoble.UI_UPDATE"
          
                  private const val ACTION_XDRIP_BG = "com.eveningoutpost.dexdrip.BgEstimate"
                  private const val EXTRA_XDRIP_BG_MGDL = "com.eveningoutpost.dexdrip.Extras.BgEstimate"
          
                  private const val ACTION_GLUCODATA_MINUTE = "glucodata.Minute"
                  private const val ACTION_GDH_GLUCODATA = "de.michelinside.glucodatahandler.GLUCODATA"
                  private const val EXTRA_GLUCODATA_MGDL = "glucodata.Minute.mgdl"
                  private const val EXTRA_GLUCODATA_CUSTOM = "glucodata.Minute.glucose"
          
                  private fun bleUuid(shortUuid: Int): UUID =
                      UUID.fromString(String.format("0000%04x-0000-1000-8000-00805f9b34fb", shortUuid))
          
                  val CCCD_UUID: UUID = bleUuid(0x2902)
          
                  // 1. Cycling Power Service (0x1818)
                  val SERVICE_CYCLING_POWER: UUID = bleUuid(0x1818)
                  val CHAR_POWER_MEASUREMENT: UUID = bleUuid(0x2A63)
                  val CHAR_POWER_FEATURE: UUID = bleUuid(0x2A65)
                  val CHAR_SENSOR_LOCATION: UUID = bleUuid(0x2A5D)
                  val CHAR_POWER_CONTROL_POINT: UUID = bleUuid(0x2A66)
          
                  // 2. Cycling Speed and Cadence Service (0x1816)
                  val SERVICE_CSC: UUID = bleUuid(0x1816)
                  val CHAR_CSC_MEASUREMENT: UUID = bleUuid(0x2A5B)
                  val CHAR_CSC_FEATURE: UUID = bleUuid(0x2A5C)
                  val CHAR_SC_CONTROL_POINT: UUID = bleUuid(0x2A55)
          
                  // 3. Heart Rate Service (0x180D)
                  val SERVICE_HEART_RATE: UUID = bleUuid(0x180D)
                  val CHAR_HEART_MEASUREMENT: UUID = bleUuid(0x2A37)
          
                  // 4. Device Information (0x180A) & Battery Service (0x180F)
                  val SERVICE_DEVICE_INFO: UUID = bleUuid(0x180A)
                  val CHAR_MANUFACTURER_NAME: UUID = bleUuid(0x2A29)
                  val CHAR_MODEL_NUMBER: UUID = bleUuid(0x2A24)
                  val CHAR_FIRMWARE_REV: UUID = bleUuid(0x2A26)
          
                  val SERVICE_BATTERY: UUID = bleUuid(0x180F)
                  val CHAR_BATTERY_LEVEL: UUID = bleUuid(0x2A19)
              }
          
              private var bluetoothManager: BluetoothManager? = null
              private var gattServer: BluetoothGattServer? = null
              private var advertiser: BluetoothLeAdvertiser? = null
              private val subscribedDevices = CopyOnWriteArraySet<BluetoothDevice>()
              private var bleStatus = "не запущен"
              private var heartTest = false
              private var sensorMode: BleSensorMode = BleSensorMode.POWER_ONLY
              private var includeCrankInPower = false
              private val notificationQueue = BleNotificationQueue<BluetoothDevice>()
              private val bleEvents = ArrayDeque<String>()
              private val pendingServicesQueue = ArrayDeque<BluetoothGattService>()
              private val peerIds = linkedMapOf<BluetoothDevice, Int>()
              private var submitted = 0
              private var completed = 0
              private var sendErrors = 0
              private var pendingSince = 0L
              private var pendingWarningShown = false
              private var lastTransfer = "ожидание подписки"
              private var destroyed = false
              private var bleGeneration = 0
              private var currentAdvertiseCallback: AdvertiseCallback? = null
          
              private var cumulativeCrankRevs: Int = 0
              private var lastCrankEventTime1024: Int = 0
              private var activeSubscribedCharUuid: UUID? = null
          
              private val activeService: UUID
                  get() = when {
                      heartTest || sensorMode == BleSensorMode.HEART_RATE -> SERVICE_HEART_RATE
                      sensorMode == BleSensorMode.CADENCE_ONLY -> SERVICE_CSC
                      else -> SERVICE_CYCLING_POWER
                  }
          
              private val activeMeasurement: UUID
                  get() = activeSubscribedCharUuid ?: when {
                      heartTest || sensorMode == BleSensorMode.HEART_RATE -> CHAR_HEART_MEASUREMENT
                      sensorMode == BleSensorMode.CADENCE_ONLY -> CHAR_CSC_MEASUREMENT
                      else -> CHAR_POWER_MEASUREMENT
                  }
          
              private val connectedDevices = CopyOnWriteArraySet<BluetoothDevice>()
              private val startupTimeout = Runnable {
                  if (isBleStarting) {
                      val stage = bleStatus
                      stopBlePeripheral()
                      bleStatus = "Нет ответа Bluetooth за 20 с ($stage). Выключите/включите Bluetooth и повторите запуск"
                      refreshStatus()
                  }
              }
              private var wakeLock: PowerManager.WakeLock? = null
              private var lastNotificationRefresh = 0L
              private val savedReading by lazy { getSharedPreferences("bridge", Context.MODE_PRIVATE) }
          
              private var multiplyBy10: Boolean = true
              private var isBleRunning: Boolean = false
              private var isBleStarting: Boolean = false
          
              @Volatile
              private var currentMmol: Double = 0.0
          
              private var lastReadingTime: Long = 0L
          
              @Volatile
              private var lastSource: String = "ожидание пакета от xDrip+ / GDH"
          
              private val mainHandler = Handler(Looper.getMainLooper())
              private val httpExecutor = Executors.newSingleThreadScheduledExecutor()
          
              private val bleTickRunnable = object : Runnable {
                  override fun run() {
                      broadcastPowerMeasurement()
                      if (notificationQueue.pending != null && !pendingWarningShown &&
                          SystemClock.elapsedRealtime() - pendingSince > 10000
                      ) {
                          pendingWarningShown = true
                          lastTransfer = "Android не завершил отправку за 10 с"
                          recordBle(lastTransfer)
                      }
                      notifyUi()
                      if (System.currentTimeMillis() - lastNotificationRefresh >= 60000) refreshStatus()
                      mainHandler.postDelayed(this, 1000L)
                  }
              }
          
              private val glucoseReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) {
                      val action = intent?.action ?: return
                      if (action == BluetoothAdapter.ACTION_STATE_CHANGED) {
                          val state = intent.getIntExtra(BluetoothAdapter.EXTRA_STATE, BluetoothAdapter.ERROR)
                          if (state == BluetoothAdapter.STATE_ON) {
                              mainHandler.post { if (!isBleRunning && !isBleStarting) startBlePowerPeripheral() }
                          } else if (state == BluetoothAdapter.STATE_TURNING_OFF || state == BluetoothAdapter.STATE_OFF) {
                              mainHandler.post {
                                  stopBlePeripheral()
                                  bleStatus = "Bluetooth выключен"
                                  refreshStatus()
                              }
                          }
                          return
                      }
                      val extras = intent.extras ?: return
          
                      when (action) {
                          ACTION_XDRIP_BG -> {
                              val mgdl = extras.getDouble(EXTRA_XDRIP_BG_MGDL, Double.NaN)
                              if (!mgdl.isNaN() && mgdl > 0) {
                                  updateGlucoseValue(
                                      mgdl,
                                      "xDrip+ Broadcast",
                                      true,
                                      extras.getLong("com.eveningoutpost.dexdrip.Extras.Time", System.currentTimeMillis())
                                  )
                              }
                          }
                          ACTION_GLUCODATA_MINUTE, ACTION_GDH_GLUCODATA -> {
                              val custom = extras.getFloat(EXTRA_GLUCODATA_CUSTOM, Float.NaN)
                              val mgdl = extras.getInt(EXTRA_GLUCODATA_MGDL, -1)
                              if (!custom.isNaN() && custom > 0f) {
                                  updateGlucoseValue(custom.toDouble(), "GlucoDataHandler", false)
                              } else if (mgdl > 0) {
                                  updateGlucoseValue(mgdl.toDouble(), "GlucoDataHandler (mg/dL)", true)
                              }
                          }
                      }
                  }
              }
          
              override fun onCreate() {
                  super.onCreate()
                  createNotificationChannel()
                  currentMmol = savedReading.getString("mmol", null)?.toDoubleOrNull() ?: 0.0
                  lastReadingTime = savedReading.getLong("timestamp", 0L)
                  lastSource = savedReading.getString("source", null) ?: "ожидание xDrip+"
                  multiplyBy10 = savedReading.getBoolean("multiply", true)
                  registerGlucoseBroadcasts()
                  startLocalWebServerPoller()
              }
          
              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val nextHeartTest = intent?.getBooleanExtra(EXTRA_HEART_TEST, false) ?: false
                  val nextModeName = intent?.getStringExtra(EXTRA_SENSOR_MODE)
                  val nextMode = if (nextModeName != null) {
                      runCatching { BleSensorMode.valueOf(nextModeName) }.getOrDefault(BleSensorMode.COMBO_POWER_CADENCE)
                  } else if (nextHeartTest) {
                      BleSensorMode.HEART_RATE
                  } else {
                      BleSensorMode.COMBO_POWER_CADENCE
                  }
          
                  if (nextHeartTest != heartTest || nextMode != sensorMode) {
                      stopBlePeripheral()
                  }
                  heartTest = nextHeartTest
                  sensorMode = nextMode
                  includeCrankInPower = true
                  multiplyBy10 = intent?.getBooleanExtra(EXTRA_MULTIPLY_BY_10, multiplyBy10) ?: multiplyBy10
                  savedReading.edit().putBoolean("multiply", multiplyBy10).apply()
          
                  // Если реальные данные от xDrip+ ещё ни разу не приходили, ставим стартовое дежурное значение 5.5 ммоль/л,
                  // чтобы велокомпьютер при поиске сразу получал живые пакеты и не считал датчик «спящим».
                  if (currentMmol <= 0.0 && lastReadingTime == 0L) {
                      currentMmol = 5.5
                      lastReadingTime = System.currentTimeMillis()
                      lastSource = "дежурное 5.5 (ожидание xDrip+)"
                  }
          
                  if (intent?.hasExtra(EXTRA_TEST_MMOL) == true) {
                      val testVal = intent.getDoubleExtra(EXTRA_TEST_MMOL, 9.3)
                      updateGlucoseValue(testVal, "ТЕСТ — 9.3 ммоль/л", false)
                  }
          
                  startForeground(NOTIFICATION_ID, buildNotification())
                  if (wakeLock?.isHeld != true) {
                      val power = getSystemService(Context.POWER_SERVICE) as PowerManager
                      wakeLock = power.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "GlucoPower:bridge").apply {
                          setReferenceCounted(false)
                          acquire()
                      }
                  }
                  if (!isBleRunning && !isBleStarting) {
                      startBlePowerPeripheral()
                  }
          
                  mainHandler.removeCallbacks(bleTickRunnable)
                  mainHandler.post(bleTickRunnable)
          
                  return START_STICKY
              }
          
              override fun onDestroy() {
                  destroyed = true
                  mainHandler.removeCallbacksAndMessages(null)
                  httpExecutor.shutdownNow()
                  runCatching { unregisterReceiver(glucoseReceiver) }
                  stopBlePeripheral()
                  wakeLock?.let { if (it.isHeld) it.release() }
                  wakeLock = null
                  super.onDestroy()
              }
          
              override fun onBind(intent: Intent?): IBinder? = null
          
              private fun registerGlucoseBroadcasts() {
                  val filter = IntentFilter().apply {
                      addAction(BluetoothAdapter.ACTION_STATE_CHANGED)
                      addAction(ACTION_XDRIP_BG)
                      addAction(ACTION_GLUCODATA_MINUTE)
                      addAction(ACTION_GDH_GLUCODATA)
                  }
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      registerReceiver(glucoseReceiver, filter, Context.RECEIVER_EXPORTED)
                  } else {
                      registerReceiver(glucoseReceiver, filter)
                  }
              }
          
              private fun updateGlucoseValue(
                  rawValue: Double,
                  source: String,
                  mgdl: Boolean,
                  timestamp: Long = System.currentTimeMillis()
              ) {
                  val mmol = BridgeProtocol.mmol(rawValue, mgdl)
                  mainHandler.post {
                      if (destroyed) return@post
                      if (!BridgeProtocol.accepts(mmol, timestamp, lastReadingTime, System.currentTimeMillis())) return@post
                      currentMmol = mmol
                      lastReadingTime = timestamp
                      lastSource = source
                      savedReading.edit().putString("mmol", mmol.toString())
                          .putLong("timestamp", timestamp).putString("source", source).apply()
                      refreshStatus()
                  }
              }
          
              private fun getWattsValue(): Int = BridgeProtocol.watts(currentMmol, multiplyBy10)
          
              private fun readingTime(): String = if (lastReadingTime == 0L) "ещё нет данных" else
                  SimpleDateFormat("dd.MM HH:mm:ss", Locale.getDefault()).format(Date(lastReadingTime))
          
              private fun refreshStatus() {
                  lastNotificationRefresh = System.currentTimeMillis()
                  val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  nm.notify(NOTIFICATION_ID, buildNotification())
                  notifyUi()
              }
          
              private fun notifyUi() {
                  val uiIntent = Intent(ACTION_UI_UPDATE).apply {
                      setPackage(packageName)
                      putExtra("mmol", currentMmol)
                      putExtra("watts", getWattsValue())
                      putExtra("source", lastSource)
                      putExtra("connected", subscribedDevices.size)
                      putExtra(
                          "ble",
                          "[${sensorMode.name}] $bleStatus; соединений: ${connectedDevices.size}\n" +
                              "Отправка: $lastTransfer; принято: $submitted, завершено: $completed, ошибок: $sendErrors"
                      )
                      putExtra("diagnostics", diagnosticReport())
                      putExtra("updated", readingTime())
                  }
                  sendBroadcast(uiIntent)
              }
          
              private fun peer(device: BluetoothDevice): String {
                  val id = peerIds.getOrPut(device) { peerIds.size + 1 }
                  val name = runCatching { device.name }.getOrNull() ?: "имя неизвестно"
                  return "клиент#$id ($name)"
              }
          
              private fun recordBle(event: String) {
                  val time = SimpleDateFormat("HH:mm:ss.SSS", Locale.ROOT).format(Date())
                  bleEvents.addLast("$time [сеанс $bleGeneration] $event")
                  while (bleEvents.size > 100) bleEvents.removeFirst()
                  Log.i(TAG, event)
              }
          
              private fun diagnosticReport(): String = buildString {
                  appendLine("GlucoPower 1.4; ${Build.MANUFACTURER} ${Build.MODEL}; Android ${Build.VERSION.RELEASE} (API ${Build.VERSION.SDK_INT})")
                  appendLine("Прошивка телефона: ${Build.DISPLAY}")
                  appendLine("Профиль: $activeService; характеристика: $activeMeasurement; режим: $sensorMode")
                  appendLine("Соединения: ${connectedDevices.size}; подписки: ${subscribedDevices.size}")
                  appendLine("Android принял: $submitted; завершил успешно: $completed; ошибок: $sendErrors")
                  appendLine("$bleStatus; $lastTransfer")
                  bleEvents.forEach { appendLine(it) }
              }
          
              private fun startLocalWebServerPoller() {
                  httpExecutor.scheduleWithFixedDelay({
                      try {
                          val url = URL("http://127.0.0.1:17580/sgv.json?count=1")
                          val conn = (url.openConnection() as HttpURLConnection).apply {
                              connectTimeout = 2000
                              readTimeout = 2000
                              requestMethod = "GET"
                          }
                          if (conn.responseCode == 200) {
                              val body = conn.inputStream.bufferedReader().use { it.readText() }
                              val jsonArray = JSONArray(body)
                              if (jsonArray.length() > 0) {
                                  val sgvMgdl = jsonArray.getJSONObject(0).optDouble("sgv", Double.NaN)
                                  if (!sgvMgdl.isNaN() && sgvMgdl > 0) {
                                      val timestamp = jsonArray.getJSONObject(0).optLong("date", 0L)
                                      if (timestamp > 0) updateGlucoseValue(sgvMgdl, "Локальный сервер :17580", true, timestamp)
                                  }
                              }
                          }
                          conn.disconnect()
                      } catch (_: Exception) {
                      }
                  }, 2, 15, java.util.concurrent.TimeUnit.SECONDS)
              }
          
              // ========================================================================
              // BLE GATT Server + Advertising
              // ========================================================================
          
              private fun startBlePowerPeripheral() {
                  stopBlePeripheral()
          
                  bluetoothManager = getSystemService(Context.BLUETOOTH_SERVICE) as BluetoothManager
                  val adapter = bluetoothManager?.adapter
                  if (adapter == null || !adapter.isEnabled) {
                      bleStatus = "Включите Bluetooth и снова нажмите запуск"
                      refreshStatus()
                      return
                  }
          
                  // Короткое ASCII-имя для гарантированного размещения в 31-байтном BLE-пакете
                  runCatching { adapter.name = "GPWR-505" }
          
                  advertiser = adapter.bluetoothLeAdvertiser
                  if (advertiser == null) {
                      bleStatus = "Телефон не поддерживает BLE Peripheral / Advertising"
                      refreshStatus()
                      return
                  }
                  isBleStarting = true
                  recordBle("Запуск режима $sensorMode (профиль $activeService)")
                  bleStatus = "регистрация GATT-сервисов"
                  mainHandler.postDelayed(startupTimeout, 20000)
          
                  try {
                      gattServer = bluetoothManager?.openGattServer(this, createGattCallback(bleGeneration))
                      pendingServicesQueue.clear()
          
                      if (heartTest || sensorMode == BleSensorMode.HEART_RATE) {
                          pendingServicesQueue.addLast(createHeartTestService())
                      } else {
                          pendingServicesQueue.addLast(createDeviceInfoService())
                          pendingServicesQueue.addLast(createBatteryService())
                          when (sensorMode) {
                              BleSensorMode.POWER_ONLY -> {
                                  pendingServicesQueue.addLast(createCyclingPowerService())
                              }
                              BleSensorMode.CADENCE_ONLY -> {
                                  pendingServicesQueue.addLast(createCscService())
                              }
                              BleSensorMode.COMBO_POWER_CADENCE -> {
                                  pendingServicesQueue.addLast(createCyclingPowerService())
                                  pendingServicesQueue.addLast(createCscService())
                              }
                              BleSensorMode.HEART_RATE -> {
                                  pendingServicesQueue.addLast(createHeartTestService())
                              }
                          }
                      }
          
                      addNextQueuedService()
                  } catch (e: RuntimeException) {
                      stopBlePeripheral()
                      bleStatus = "Ошибка GATT: ${e.javaClass.simpleName}: ${e.message}"
                  }
                  refreshStatus()
              }
          
              private fun addNextQueuedService() {
                  val nextService = pendingServicesQueue.pollFirst()
                  if (nextService == null) {
                      advertisePowerService(includeNameInPrimary = true, includeNameInScan = true)
                      return
                  }
                  if (gattServer?.addService(nextService) != true) {
                      stopBlePeripheral()
                      bleStatus = "Не удалось зарегистрировать GATT-сервис ${nextService.uuid}; повторите запуск"
                      refreshStatus()
                  }
              }
          
              private fun advertisePowerService(includeNameInPrimary: Boolean = true, includeNameInScan: Boolean = true) {
                  val settings = AdvertiseSettings.Builder()
                      .setAdvertiseMode(AdvertiseSettings.ADVERTISE_MODE_LOW_LATENCY)
                      .setTxPowerLevel(AdvertiseSettings.ADVERTISE_TX_POWER_HIGH)
                      .setConnectable(true)
                      .setTimeout(0)
                      .build()
          
                  val name = bluetoothManager?.adapter?.name
                  val uuidsToAdvertise = when {
                      heartTest || sensorMode == BleSensorMode.HEART_RATE -> listOf(SERVICE_HEART_RATE)
                      sensorMode == BleSensorMode.CADENCE_ONLY -> listOf(SERVICE_CSC)
                      sensorMode == BleSensorMode.COMBO_POWER_CADENCE -> listOf(SERVICE_CYCLING_POWER, SERVICE_CSC)
                      else -> listOf(SERVICE_CYCLING_POWER)
                  }
          
                  val primaryName = includeNameInPrimary &&
                      BridgeProtocol.canIncludeName(name, primary = true, uuidCount = uuidsToAdvertise.size)
                  val scanName = !primaryName && includeNameInScan && BridgeProtocol.canIncludeName(name, primary = false)
          
                  val dataBuilder = AdvertiseData.Builder()
                      .setIncludeDeviceName(primaryName)
                      .setIncludeTxPowerLevel(false)
                  uuidsToAdvertise.forEach { dataBuilder.addServiceUuid(ParcelUuid(it)) }
                  val data = dataBuilder.build()
          
                  val scanResponse = AdvertiseData.Builder()
                      .setIncludeDeviceName(scanName)
                      .build()
          
                  recordBle("ADV: UUIDs=$uuidsToAdvertise; имя='$name' (primary=$primaryName, scan=$scanName)")
                  bleStatus = "GATT готов; запуск рекламы $uuidsToAdvertise"
                  refreshStatus()
                  try {
                      val callback = createAdvertiseCallback(bleGeneration, primaryName, scanName)
                      currentAdvertiseCallback = callback
                      advertiser?.startAdvertising(settings, data, scanResponse, callback)
                  } catch (e: RuntimeException) {
                      stopBlePeripheral()
                      bleStatus = "Ошибка запуска рекламы: ${e.javaClass.simpleName}: ${e.message}"
                      refreshStatus()
                  }
              }
          
              private fun stopBlePeripheral() {
                  bleGeneration++
                  mainHandler.removeCallbacks(startupTimeout)
                  runCatching { currentAdvertiseCallback?.let { advertiser?.stopAdvertising(it) } }
                  currentAdvertiseCallback = null
                  runCatching { gattServer?.close() }
                  pendingServicesQueue.clear()
                  subscribedDevices.clear()
                  connectedDevices.clear()
                  notificationQueue.clear()
                  activeSubscribedCharUuid = null
                  submitted = 0
                  completed = 0
                  sendErrors = 0
                  lastTransfer = "ожидание подписки"
                  isBleRunning = false
                  isBleStarting = false
                  gattServer = null
                  advertiser = null
              }
          
              private fun createDeviceInfoService(): BluetoothGattService {
                  val service = BluetoothGattService(SERVICE_DEVICE_INFO, BluetoothGattService.SERVICE_TYPE_PRIMARY)
                  service.addCharacteristic(
                      BluetoothGattCharacteristic(
                          CHAR_MANUFACTURER_NAME,
                          BluetoothGattCharacteristic.PROPERTY_READ,
                          BluetoothGattCharacteristic.PERMISSION_READ
                      )
                  )
                  service.addCharacteristic(
                      BluetoothGattCharacteristic(
                          CHAR_MODEL_NUMBER,
                          BluetoothGattCharacteristic.PROPERTY_READ,
                          BluetoothGattCharacteristic.PERMISSION_READ
                      )
                  )
                  service.addCharacteristic(
                      BluetoothGattCharacteristic(
                          CHAR_FIRMWARE_REV,
                          BluetoothGattCharacteristic.PROPERTY_READ,
                          BluetoothGattCharacteristic.PERMISSION_READ
                      )
                  )
                  return service
              }
          
              private fun createBatteryService(): BluetoothGattService {
                  val service = BluetoothGattService(SERVICE_BATTERY, BluetoothGattService.SERVICE_TYPE_PRIMARY)
                  val batteryLevel = BluetoothGattCharacteristic(
                      CHAR_BATTERY_LEVEL,
                      BluetoothGattCharacteristic.PROPERTY_READ or BluetoothGattCharacteristic.PROPERTY_NOTIFY,
                      BluetoothGattCharacteristic.PERMISSION_READ
                  )
                  batteryLevel.addDescriptor(
                      BluetoothGattDescriptor(
                          CCCD_UUID,
                          BluetoothGattDescriptor.PERMISSION_READ or BluetoothGattDescriptor.PERMISSION_WRITE
                      )
                  )
                  service.addCharacteristic(batteryLevel)
                  return service
              }
          
              private fun createHeartTestService(): BluetoothGattService {
                  val service = BluetoothGattService(SERVICE_HEART_RATE, BluetoothGattService.SERVICE_TYPE_PRIMARY)
                  val measurement = BluetoothGattCharacteristic(
                      CHAR_HEART_MEASUREMENT,
                      BluetoothGattCharacteristic.PROPERTY_NOTIFY,
                      0
                  )
                  measurement.addDescriptor(
                      BluetoothGattDescriptor(
                          CCCD_UUID,
                          BluetoothGattDescriptor.PERMISSION_READ or BluetoothGattDescriptor.PERMISSION_WRITE
                      )
                  )
                  service.addCharacteristic(measurement)
                  return service
              }
          
              private fun createCyclingPowerService(): BluetoothGattService {
                  val service = BluetoothGattService(SERVICE_CYCLING_POWER, BluetoothGattService.SERVICE_TYPE_PRIMARY)
          
                  val measurement = BluetoothGattCharacteristic(
                      CHAR_POWER_MEASUREMENT,
                      BluetoothGattCharacteristic.PROPERTY_NOTIFY,
                      0
                  )
                  measurement.addDescriptor(
                      BluetoothGattDescriptor(
                          CCCD_UUID,
                          BluetoothGattDescriptor.PERMISSION_READ or BluetoothGattDescriptor.PERMISSION_WRITE
                      )
                  )
          
                  val feature = BluetoothGattCharacteristic(
                      CHAR_POWER_FEATURE,
                      BluetoothGattCharacteristic.PROPERTY_READ,
                      BluetoothGattCharacteristic.PERMISSION_READ
                  )
          
                  val location = BluetoothGattCharacteristic(
                      CHAR_SENSOR_LOCATION,
                      BluetoothGattCharacteristic.PROPERTY_READ,
                      BluetoothGattCharacteristic.PERMISSION_READ
                  )
          
                  val controlPoint = BluetoothGattCharacteristic(
                      CHAR_POWER_CONTROL_POINT,
                      BluetoothGattCharacteristic.PROPERTY_WRITE or BluetoothGattCharacteristic.PROPERTY_INDICATE,
                      BluetoothGattCharacteristic.PERMISSION_WRITE
                  )
                  controlPoint.addDescriptor(
                      BluetoothGattDescriptor(
                          CCCD_UUID,
                          BluetoothGattDescriptor.PERMISSION_READ or BluetoothGattDescriptor.PERMISSION_WRITE
                      )
