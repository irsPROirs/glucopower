name: Build GlucoPower APK

on:
  push:
    branches: [main, 'fix/**']
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Setup Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Choose Gradle executable
        shell: bash
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            echo 'GRADLE=./gradlew' >> "$GITHUB_ENV"
          else
            echo 'GRADLE=gradle' >> "$GITHUB_ENV"
          fi

      # Never expose a signing key to pull request code, including same-repo PRs.
      - name: Restore optional stable debug keystore
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            umask 077
            mkdir -p "$HOME/.android"
            printf '%s' "$KS" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
            keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey > /dev/null
          else
            echo '::warning::DEBUG_KEYSTORE_BASE64 is not configured; this APK uses an ephemeral debug key.'
          fi

      - name: Build debug APK
        shell: bash
        run: |
          "$GRADLE" assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk GlucoPower.apk

      - name: Run BLE regression tests and lint
        shell: bash
        run: '"$GRADLE" testDebugUnitTest lintDebug --no-daemon'

      - name: Upload GlucoPower.apk to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GlucoPower-APK
          path: GlucoPower.apk
          if-no-files-found: error

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GlucoPower-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

  release:
    needs: build-apk
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download validated APK
        uses: actions/download-artifact@v4
        with:
          name: GlucoPower-APK

      - name: Publish GlucoPower.apk to Releases (Direct Download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: "GlucoPower APK (сборка #${{ github.run_number }})"
          prerelease: true
          body: "Нажмите на файл **GlucoPower.apk** ниже, чтобы скачать и установить приложение на Android."
          files: GlucoPower.apk
          fail_on_unmatched_files: true
