              private lateinit var checkMultiply10: CheckBox
              private lateinit var checkVivoFix: CheckBox
              private lateinit var checkLegacy3Arg: CheckBox
              private lateinit var radioPowerOnly: RadioButton
              private lateinit var radioPowerCrank: RadioButton
              private lateinit var radioFtms: RadioButton
              private lateinit var radioCadence: RadioButton
              private lateinit var radioHeart: RadioButton
              private var pendingStartTestMmol: Double? = null
              private var hasPendingStart: Boolean = false
              private var lastDiagnostics = "GlucoPower 1.5: сначала запустите BLE-сервис"
          
              private val uiReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) {
