                          "1. Удалите на самом велокомпьютере CC600 ранее добавленные датчики телефона (Каденс / Пульс GPWR-505), иначе CC600 держит соединение со старым слотом и не показывает этот же телефон в поиске Мощности.\n" +
                          "2. Полностью закройте приложение OnelapFit на телефоне.\n" +
                          "3. Выберите Режим 1 (Чистый 0x1818 как в v1.0) или Режим 2 (0x1818 с вращением педалей и калибровкой). Если слот Мощности на CC600 ищет только ANT+, выберите Режим 3 (Велотренажёр FTMS 0x1826) и добавьте телефон в меню «Тренажёр» — он тоже выводит Ватты в поле мощности!"
                      textSize = 13f
                      setPadding(0, 0, 0, 16)
                  }
                  root.addView(hintView)
          
                  statusText = TextView(this).apply {
                      text = "Сервис не запущен. Выберите режим и нажмите кнопку 1 или 2."
