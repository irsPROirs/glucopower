name: Build GlucoPower APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Compile APK and run BLE regression tests
        run: |
          gradle assembleDebug testDebugUnitTest lintDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk GlucoPower.apk

      - name: Upload GlucoPower.apk to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GlucoPower-APK
          path: GlucoPower.apk

      - name: Publish GlucoPower.apk to Releases (Direct Download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "GlucoPower APK (сборка #${{ github.run_number }})"
          body: "Нажмите на файл **GlucoPower.apk** ниже, чтобы скачать и установить приложение на Android."
          files: GlucoPower.apk
