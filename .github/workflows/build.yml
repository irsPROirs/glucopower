          enum class BleSensorMode(val title: String) {
              COMBO_POWER_CADENCE("1. Комбо: Мощность + Каденс (0x1818 + 0x1816 сразу)"),
              CADENCE_ONLY("2. Датчик каденса (0x1816, об/мин) — рекомендуется для CC600"),
              POWER_ONLY("3. Датчик мощности (0x1818, Вт) — с вращением шатуна"),
              HEART_RATE("4. Пульсометр (0x180D, уд/мин) — проверка видимости BLE")
          }
          
          object BridgeProtocol {
              fun mmol(raw: Double, mgdl: Boolean): Double = if (mgdl) raw / 18.0182 else raw
          
              fun watts(mmol: Double, multiply: Boolean): Int =
                  (mmol * if (multiply) 10.0 else 1.0).roundToInt().coerceIn(0, 32767)
          
              fun measurement(watts: Int): ByteArray = ByteBuffer.allocate(4)
                  .order(ByteOrder.LITTLE_ENDIAN)
                  .putShort(0)
                  .putShort(watts.toShort())
                  .array()
          
              /**
               * Полный 8-байтный пакет мощности (0x2A63) с данными вращения шатуна (Crank Revolution Data Present, бит 5 = 0x0020).
               * Большинство велокомпьютеров при поиске пауэрметра ждут вращения педалей, иначе считают датчик «спящим».
               */
              fun powerMeasurementWithCrank(watts: Int, cumulativeCrankRevs: Int, lastCrankTime1024: Int): ByteArray =
                  ByteBuffer.allocate(8)
                      .order(ByteOrder.LITTLE_ENDIAN)
                      .putShort(0x0020)
                      .putShort(watts.toShort())
                      .putShort((cumulativeCrankRevs and 0xFFFF).toShort())
                      .putShort((lastCrankTime1024 and 0xFFFF).toShort())
                      .array()
          
              /**
               * Пакет датчика каденса CSC Measurement (0x2A5B):
               * Байт 0: Flags = 0x02 (Crank Revolution Data Present)
               * Байты 1..2: Cumulative Crank Revolutions (uint16, Little Endian)
               * Байты 3..4: Last Crank Event Time в 1/1024 сек (uint16, Little Endian)
               */
              fun cadenceMeasurement(cumulativeCrankRevs: Int, lastCrankTime1024: Int): ByteArray =
                  ByteBuffer.allocate(5)
                      .order(ByteOrder.LITTLE_ENDIAN)
                      .put(0x02.toByte())
                      .putShort((cumulativeCrankRevs and 0xFFFF).toShort())
                      .putShort((lastCrankTime1024 and 0xFFFF).toShort())
                      .array()
          
              // Flags: 3 bytes, complete 16-bit service UUID: 4 bytes (or 6 bytes for 2 UUIDs), name header: 2 bytes.
              fun canIncludeName(name: String?, primary: Boolean = false, uuidCount: Int = 1): Boolean {
                  if (name.isNullOrEmpty()) return false
                  val maxBytes = if (primary) (24 - (uuidCount * 2)) else 29
                  return name.toByteArray(Charsets.UTF_8).size <= maxBytes
              }
          
              fun serviceUuid(heartTest: Boolean): Int = if (heartTest) 0x180d else 0x1818
          
              fun heartTestMeasurement(): ByteArray = byteArrayOf(0, 93)
          
              fun heartMeasurement(bpm: Int): ByteArray = byteArrayOf(0, bpm.coerceIn(1, 255).toByte())
          
              fun accepts(value: Double, timestamp: Long, previous: Long, now: Long): Boolean =
                  value.isFinite() && value > 0 && timestamp > 0 && timestamp >= previous && timestamp <= now + 60000
          }
          
          /** One outstanding Android GATT notification; queued samples are coalesced per client. */
          class BleNotificationQueue<T : Any> {
              private val waiting = linkedMapOf<T, ByteArray>()
              var pending: T? = null
                  private set
          
              fun offer(client: T, bytes: ByteArray) {
                  waiting[client] = bytes.copyOf()
              }
          
              fun next(): Pair<T, ByteArray>? {
                  if (pending != null || waiting.isEmpty()) return null
                  val first = waiting.entries.first()
                  val item = first.key to first.value
                  waiting.remove(first.key)
                  pending = item.first
                  return item
              }
          
              fun complete(client: T): Boolean {
                  if (pending != client) return false
                  pending = null
                  return true
              }
          
              fun remove(client: T, disconnected: Boolean = false) {
                  waiting.remove(client)
                  if (disconnected && pending == client) pending = null
              }
          
              fun clear() {
                  waiting.clear()
                  pending = null
              }
          }
          
          class MainActivity : Activity() {
          
              private lateinit var statusText: TextView
