                          "• У многих прошивок Geoid CC600 / Magene C506 SE измерители мощности подключаются ТОЛЬКО по ANT+, а по Bluetooth (BLE) работают только Каденс, Скорость и Пульс.\n" +
                          "• Оставьте выбранным «1. Комбо» или «2. Датчик каденса (0x1816)» — тогда CC600 найдёт телефон как датчик каденса (9.3 ммоль/л = 93 об/мин)."
                      textSize = 13f
                      setPadding(0, 0, 0, 20)
                  }
                  root.addView(hintView)
          
                  statusText = TextView(this).apply {
                      text = "Сервис не запущен. Выберите режим и нажмите кнопку 1 или 2."
